name: Release

# Releases happen in two ways:
# - Automatically, when a push to master only changes the base image (FROM line) in the Dockerfile,
#   i.e. a merged Renovate PR. This cuts the next patch version.
# - Manually, via "Run workflow", choosing patch / minor / major.

on:
  push:
    branches: [master]
    paths: [Dockerfile]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      base_image: ${{ steps.version.outputs.base_image }}
      nginx_version: ${{ steps.version.outputs.nginx_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to release
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release=false
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            from_before=$(git show "${BEFORE}:Dockerfile" | grep '^FROM ' || true)
            from_after=$(grep '^FROM ' Dockerfile || true)
            # Everything except the FROM lines must be unchanged
            rest_before=$(git show "${BEFORE}:Dockerfile" | grep -v '^FROM ' || true)
            rest_after=$(grep -v '^FROM ' Dockerfile || true)
            if [ "$changed" = "Dockerfile" ] && [ "$from_before" != "$from_after" ] && [ "$rest_before" = "$rest_after" ]; then
              release=true
            fi
          fi
          echo "Base image update only: $release"
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: version
        if: steps.check.outputs.release == 'true'
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
          major=${major#v}
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "::error::Unknown bump '$BUMP'"; exit 1 ;;
          esac
          version="${major}.${minor}.${patch}"

          if git rev-parse -q --verify "refs/tags/v${version}" > /dev/null; then
            echo "::error::Tag v${version} already exists"
            exit 1
          fi

          base_image=$(grep -m1 '^FROM ' Dockerfile | awk '{print $2}')
          nginx_version=$(echo "$base_image" | sed -E 's/^[^:]+:([0-9]+\.[0-9]+\.[0-9]+).*/\1/')

          echo "Releasing v${version} (previous: ${last:-none}, nginx ${nginx_version})"
          {
            echo "version=${version}"
            echo "base_image=${base_image}"
            echo "nginx_version=${nginx_version}"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [prepare, test]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tag + GitHub release
      id-token: write # cosign keyless signing
    env:
      IMAGE: ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}
      VERSION: ${{ needs.prepare.outputs.version }}
      NGINX_VERSION: ${{ needs.prepare.outputs.nginx_version }}
      BASE_IMAGE: ${{ needs.prepare.outputs.base_image }}
    steps:
      - name: Check registry configuration
        if: vars.REGISTRY == '' || vars.IMAGE_NAME == ''
        run: |
          echo "::error::Set the REGISTRY and IMAGE_NAME repository variables (and REGISTRY_USERNAME / REGISTRY_PASSWORD secrets)"
          exit 1

      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=true
          tags: |
            type=semver,pattern=v{{version}},value=v${{ env.VERSION }}
            type=semver,pattern=v{{major}}.{{minor}},value=v${{ env.VERSION }}
            type=semver,pattern=v{{major}},value=v${{ env.VERSION }}
            type=raw,value=nginx-${{ env.NGINX_VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.base.name=${{ env.BASE_IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v4

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_list=""
          for tag in $TAGS; do
            tag_list="${tag_list}- \`${tag}\`"$'\n'
          done

          notes=$(cat <<EOF
          **nginx ${NGINX_VERSION}** (\`${BASE_IMAGE%@*}\`)

          Image: \`${IMAGE}@${DIGEST}\`

          Tags:
          ${tag_list}

          Verify the signature:
          \`\`\`sh
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          )
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --notes "$notes" \
            --generate-notes
