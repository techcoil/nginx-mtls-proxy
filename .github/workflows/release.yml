name: Release

# The app version (vX.Y.Z) only changes when the app changes. nginx updates rebuild the latest version.
#
# - release: manual, via "Run workflow", choosing patch / minor / major. Creates a new version,
#   git tag and GitHub release.
# - rebuild: automatic, when a push to master only changes the base image (FROM line) in the Dockerfile,
#   i.e. a merged Renovate PR, or manual, choosing "rebuild". Rebuilds master as the latest released
#   version on the current base image and appends the build to that version's GitHub release.
#
# Published image tags:
#   vX.Y.Z               - the version, on the newest nginx it was built with
#   vX.Y.Z-nginx-A.B.C   - the version on a specific nginx
#   nginx-A.B.C          - the newest version on a specific nginx

on:
  push:
    branches: [master]
    paths: [Dockerfile]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump, or "rebuild" to republish the latest version without a bump
        type: choice
        options: [patch, minor, major, rebuild]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.check.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
      base_image: ${{ steps.version.outputs.base_image }}
      nginx_version: ${{ steps.version.outputs.nginx_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide release mode
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$BUMP" = "rebuild" ]; then
              echo "mode=rebuild" >> "$GITHUB_OUTPUT"
            else
              echo "mode=release" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          mode=none
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            from_before=$(git show "${BEFORE}:Dockerfile" | grep '^FROM ' || true)
            from_after=$(grep '^FROM ' Dockerfile || true)
            # Everything except the FROM lines must be unchanged
            rest_before=$(git show "${BEFORE}:Dockerfile" | grep -v '^FROM ' || true)
            rest_after=$(grep -v '^FROM ' Dockerfile || true)
            if [ "$changed" = "Dockerfile" ] && [ "$from_before" != "$from_after" ] && [ "$rest_before" = "$rest_after" ]; then
              mode=rebuild
            fi
          fi
          echo "Mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: version
        if: steps.check.outputs.mode != 'none'
        env:
          MODE: ${{ steps.check.outputs.mode }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)

          if [ "$MODE" = "rebuild" ]; then
            if [ -z "$last" ]; then
              echo "::error::No released version to rebuild - run a manual release first"
              exit 1
            fi
            version=${last#v}
          else
            IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
            major=${major#v}
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
              *) echo "::error::Unknown bump '$BUMP'"; exit 1 ;;
            esac
            version="${major}.${minor}.${patch}"

            if git rev-parse -q --verify "refs/tags/v${version}" > /dev/null; then
              echo "::error::Tag v${version} already exists"
              exit 1
            fi
          fi

          base_image=$(grep -m1 '^FROM ' Dockerfile | awk '{print $2}')
          nginx_version=$(echo "$base_image" | sed -E 's/^[^:]+:([0-9]+\.[0-9]+\.[0-9]+).*/\1/')

          echo "${MODE}: v${version} (latest tag: ${last:-none}, nginx ${nginx_version})"
          {
            echo "version=${version}"
            echo "base_image=${base_image}"
            echo "nginx_version=${nginx_version}"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    if: needs.prepare.outputs.mode != 'none'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [prepare, test]
    if: needs.prepare.outputs.mode != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tag + GitHub release
      id-token: write # cosign keyless signing
    env:
      IMAGE: ${{ vars.REGISTRY }}/${{ vars.IMAGE_NAME }}
      MODE: ${{ needs.prepare.outputs.mode }}
      VERSION: ${{ needs.prepare.outputs.version }}
      NGINX_VERSION: ${{ needs.prepare.outputs.nginx_version }}
      BASE_IMAGE: ${{ needs.prepare.outputs.base_image }}
    steps:
      - name: Check registry configuration
        if: vars.REGISTRY == '' || vars.IMAGE_NAME == ''
        run: |
          echo "::error::Set the REGISTRY and IMAGE_NAME repository variables (and REGISTRY_USERNAME / REGISTRY_PASSWORD secrets)"
          exit 1

      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=v${{ env.VERSION }}
            type=raw,value=v${{ env.VERSION }}-nginx-${{ env.NGINX_VERSION }}
            type=raw,value=nginx-${{ env.NGINX_VERSION }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.base.name=${{ env.BASE_IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v4.1.4

      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_list=""
          for tag in $TAGS; do
            tag_list="${tag_list}- \`${tag}\`"$'\n'
          done

          build_notes=$(cat <<EOF
          ### Build: nginx ${NGINX_VERSION} ($(date -u +%Y-%m-%d))

          Base image: \`${BASE_IMAGE%@*}\`
          Image: \`${IMAGE}@${DIGEST}\`

          Tags:
          ${tag_list}
          Verify the signature:
          \`\`\`sh
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          )

          if [ "$MODE" = "release" ]; then
            gh release create "v${VERSION}" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION}" \
              --notes "$build_notes" \
              --generate-notes
          elif gh release view "v${VERSION}" > /dev/null 2>&1; then
            body=$(gh release view "v${VERSION}" --json body --jq .body)
            gh release edit "v${VERSION}" --notes "${body}"$'\n\n'"${build_notes}"
          else
            gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --notes "$build_notes"
          fi
