name: Renovate

# Self-hosted Renovate: opens PRs for base image (nginx) and GitHub Actions updates, see renovate.json.
# Requires a RENOVATE_TOKEN secret (fine-grained PAT or GitHub App token) - PRs merged with the default
# GITHUB_TOKEN would not trigger the Release workflow.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@v46.3.15
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
